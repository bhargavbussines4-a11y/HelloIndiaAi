<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello India AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0b0f14;
  color:white;
  height:100vh;
  overflow:hidden;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  border-bottom:1px solid #252b33;
  background:#10151c;
}

.left{
  display:flex;
  align-items:center;
  gap:13px;
}

.menu{
  font-size:27px;
  cursor:pointer;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span,
.welcome h1 span{
  color:#ff7a00;
}

.auth{
  display:flex;
  gap:7px;
}

.auth button{
  border:1px solid #39414c;
  background:#171d25;
  color:white;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
}

main{
  height:calc(100vh - 65px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.welcome{
  text-align:center;
  margin-bottom:35px;
}

.welcome h1{
  font-size:34px;
  margin-bottom:10px;
}

.welcome p{
  color:#9ca5b1;
  font-size:15px;
}

.chatbox{
  width:100%;
  max-width:700px;
}

.input-area{
  display:flex;
  align-items:center;
  gap:8px;
  background:#171d25;
  border:1px solid #303844;
  border-radius:18px;
  padding:9px;
}

.input-area input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:white;
  font-size:16px;
  padding:10px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:12px;
  background:#252c35;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send{
  background:#ff7a00;
}

.hint{
  text-align:center;
  color:#68727e;
  font-size:12px;
  margin-top:12px;
}

.sidebar{
  position:fixed;
  top:0;
  left:-280px;
  width:280px;
  height:100%;
  background:#11161d;
  z-index:10;
  transition:.3s;
  padding:20px;
  border-right:1px solid #303640;
}

.sidebar.active{
  left:0;
}

.sidebar h2{
  margin-bottom:25px;
}

.newchat{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#ff7a00;
  color:white;
  font-weight:bold;
  margin-bottom:25px;
  cursor:pointer;
}

.history{
  color:#aab2bd;
}

.history div{
  padding:12px 5px;
  border-bottom:1px solid #252b33;
  word-break:break-word;
}

.close{
  position:absolute;
  right:18px;
  top:18px;
  font-size:22px;
  cursor:pointer;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:5;
}

.overlay.active{
  display:block;
}

@media(max-width:500px){

  .welcome h1{
    font-size:28px;
  }

  .auth button{
    padding:7px 8px;
    font-size:12px;
  }

  .logo{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="sidebar" id="sidebar">

  <div class="close" onclick="closeMenu()">✕</div>

  <h2>☰ History</h2>

  <button class="newchat" onclick="newChat()">
    ＋ New Chat
  </button>

  <div class="history" id="history">
    <div>No history yet</div>
  </div>

</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<header>

  <div class="left">

    <div class="menu" onclick="openMenu()">
      ☰
    </div>

    <div class="logo">
      Hello <span>India</span> AI
    </div>

  </div>

  <div class="auth">

    <button onclick="login()">
      Login
    </button>

    <button onclick="signup()">
      Signup
    </button>

  </div>

</header>

<main>

  <div class="welcome">

    <h1>
      Welcome to <span>Hello India AI</span> 🇮🇳
    </h1>

    <p>
      Ask anything. Search anything. Talk with AI.
    </p>

  </div>

  <div class="chatbox">

    <div class="input-area">

      <button
        class="icon-btn"
        onclick="startVoice()">
        🎤
      </button>

      <input
        id="message"
        type="text"
        placeholder="Ask Hello India AI..."
        onkeydown="enterSend(event)"
      >

      <button
        class="icon-btn send"
        onclick="sendMessage()">
        ➤
      </button>

    </div>

    <div class="hint">
      Hello India AI • Your AI assistant
    </div>

  </div>

</main>

<script>

function openMenu(){

  document
    .getElementById("sidebar")
    .classList.add("active");

  document
    .getElementById("overlay")
    .classList.add("active");
}


function closeMenu(){

  document
    .getElementById("sidebar")
    .classList.remove("active");

  document
    .getElementById("overlay")
    .classList.remove("active");
}


function sendMessage(){

  const input =
    document.getElementById("message");

  const text =
    input.value.trim();

  if(text === ""){
    return;
  }

  let history =
    document.getElementById("history");

  if(history.innerText === "No history yet"){
    history.innerHTML = "";
  }

  let item =
    document.createElement("div");

  item.innerText = text;

  history.prepend(item);

  input.value = "";

  alert(
    "Hello India AI ka AI system next step mein connect hoga."
  );
}


function enterSend(event){

  if(event.key === "Enter"){
    sendMessage();
  }

}


function newChat(){

  document.getElementById("message").value = "";

  closeMenu();

}


function login(){

  alert(
    "Login system next step mein banega."
  );

}


function signup(){

  alert(
    "Signup system next step mein banega."
  );

}


function startVoice(){

  if(!("webkitSpeechRecognition" in window)){

    alert(
      "Voice input is not supported in this browser."
    );

    return;
  }

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang = "hi-IN";

  recognition.onresult =
    function(event){

      document.getElementById("message").value =
        event.results[0][0].transcript;

    };

  recognition.start();

}

</script>

</body>
</html>
